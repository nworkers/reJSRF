name: CI

# The fast gate: a broken build is found on the branch rather than after the
# merge. No game data exists in CI, so there is no generated code either: this
# builds the no-recompiled-code configuration and stops. Anything that needs an
# XBE is verified locally (docs/guides/).
on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on a task branch (gh workflow run ci.yml --ref <branch>) to
  # check a CI change before any pull request exists.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win32:
    name: Win32 x86 build
    # Pinned rather than windows-latest: build_win32_x86.ps1 picks its
    # generator from the installed Visual Studio, so a floating image would
    # silently change the toolchain.
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The runtime (third_party/rexbox) and its own submodules (SDL, imgui,
          # smaa, XbSymbolDatabase); rexbox_recomp compiles against
          # third_party/xboxrecomp's pinned ABI header.
          submodules: recursive

      - name: Build
        shell: powershell
        run: .\scripts\build_win32_x86.ps1 -Configuration ${{ matrix.configuration }}

      - name: Probe - kernel HLE
        shell: powershell
        run: .\build\win32_x86\third_party\rexbox\tools\${{ matrix.configuration }}\rexbox_kernel_probe.exe

      - name: Probe - DSOUND HLE
        shell: powershell
        run: .\build\win32_x86\third_party\rexbox\tools\${{ matrix.configuration }}\rexbox_dsound_probe.exe

      - name: Probe - D3D8 HLE
        shell: powershell
        run: .\build\win32_x86\third_party\rexbox\tools\${{ matrix.configuration }}\rexbox_d3d8_probe.exe

      - name: Smoke - app rejects a file and a directory without an XBE
        shell: powershell
        run: |
          & .\build\win32_x86\src\app\${{ matrix.configuration }}\rejsrf.exe LICENSE
          if ($LASTEXITCODE -ne 1) { throw "file: expected exit code 1, got $LASTEXITCODE" }
          & .\build\win32_x86\src\app\${{ matrix.configuration }}\rejsrf.exe docs
          if ($LASTEXITCODE -ne 1) { throw "directory: expected exit code 1, got $LASTEXITCODE" }
          exit 0

      # The Japanese-disc variant (docs/design/20261020-i108-japanese-variant.md):
      # its own tree, so the REJSRF_VARIANT_JP branches compile. Release only.
      - name: Build - Japanese variant (app)
        if: matrix.configuration == 'Release'
        shell: powershell
        run: .\scripts\build_win32_x86.ps1 -Configuration Release -Variant jp -Target rejsrf

      - name: Smoke - Japanese variant rejects a directory without an XBE
        if: matrix.configuration == 'Release'
        shell: powershell
        run: |
          & .\build\win32_x86_jp\src\app\Release\rejsrf.exe docs
          if ($LASTEXITCODE -ne 1) { throw "directory: expected exit code 1, got $LASTEXITCODE" }
          exit 0

  linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.configuration }} build
    # Pinned like the Windows image. x86 is a -m32 build on the multilib
    # toolchain with the i386 development libraries SDL3 compiles against
    # (docs/design/20261025-i119-linux.md, rexbox's design i004).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [x64, x86]
        configuration: [debug, release]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install the toolchain and SDL3's development libraries
        run: |
          set -e
          libraries="libasound2-dev libpulse-dev libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl-dev libegl-dev"
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            i386=""
            for p in $libraries; do
              i386="$i386 $p:i386"
            done
            sudo apt-get install -y gcc-multilib g++-multilib ninja-build $i386
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build $libraries
          fi

      - name: Build and run the probes (ctest)
        run: bash scripts/build_linux.sh ${{ matrix.arch }} ${{ matrix.configuration }}

      - name: Smoke - app rejects a file and a directory without an XBE
        run: |
          app=build/linux-${{ matrix.arch }}-${{ matrix.configuration }}/src/app/rejsrf
          set +e
          "$app" LICENSE; code=$?
          [ "$code" = 1 ] || { echo "file: expected exit code 1, got $code"; exit 1; }
          "$app" docs; code=$?
          [ "$code" = 1 ] || { echo "directory: expected exit code 1, got $code"; exit 1; }

      # The Japanese-disc variant: its own tree, so the REJSRF_VARIANT_JP
      # branches compile on GCC too. x64 Release only.
      - name: Build - Japanese variant (app)
        if: matrix.arch == 'x64' && matrix.configuration == 'release'
        run: bash scripts/build_linux.sh x64 release jp --target rejsrf

      - name: Smoke - Japanese variant rejects a directory without an XBE
        if: matrix.arch == 'x64' && matrix.configuration == 'release'
        run: |
          set +e
          build/linux-x64-release-jp/src/app/rejsrf docs; code=$?
          [ "$code" = 1 ] || { echo "directory: expected exit code 1, got $code"; exit 1; }
